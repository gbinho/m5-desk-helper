; Bichinho de mesa para M5StickC Plus
;   gravar pelo USB: pio run -t upload

[platformio]
default_envs = usb

[env]
platform = espressif32
board = m5stick-c
framework = arduino
; sem gravacao por Wi-Fi: uma particao so, de 3 MB, para caber mais GIFs
board_build.partitions = huge_app.csv
; fontes geradas por tools/make_fonts.py; GIFs por tools/make_gifs.py
board_build.embed_files =
    assets/small.vlw
    assets/medium.vlw
    assets/num.vlw
    assets/big.vlw
    assets/gifs.pack
; Bluetooth enxuto (um celular so), para sobrar memoria para o resto
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=2
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    m5stack/M5Unified@^0.2.2
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/AnimatedGIF@^2.1.1
    h2zero/NimBLE-Arduino@^2.3.0

[env:usb]
upload_speed = 1500000
